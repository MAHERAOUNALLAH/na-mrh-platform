<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NA-MRH Digital Collaboration Platform — Maquette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F3EA;
    --surface:#FFFFFF;
    --ink:#201A15;
    --ink-soft:#5B5348;
    --red:#A31621;
    --red-deep:#7C1019;
    --green:#10552C;
    --green-deep:#0B3E20;
    --gold:#C08A28;
    --line:#DDD3C0;
    --line-strong:#C7BBA0;
    --wave1:#A31621;
    --wave2:#C08A28;
    --wave3:#8A8071;
    --radius:2px;
    --serif:'Zilla Slab', Georgia, serif;
    --sans:'Public Sans', -apple-system, sans-serif;
    --ar-serif:'Amiri', serif;
    --ar-sans:'Cairo', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body[data-lang="ar"]{font-family:var(--ar-sans);}
  body[data-lang="ar"] h1, body[data-lang="ar"] h2, body[data-lang="ar"] h3, body[data-lang="ar"] .display{
    font-family:var(--ar-serif);
  }
  h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; color:var(--ink);}
  p{margin:0;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  .container{max-width:1180px; margin:0 auto; padding:0 28px;}
  ::selection{background:var(--gold); color:#fff;}
  :focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

  /* ---------- MOCKUP BANNER ---------- */
  .mockup-banner{
    background:var(--ink);
    color:#F2E9D8;
    text-align:center;
    font-size:12.5px;
    letter-spacing:.02em;
    padding:7px 14px;
    font-weight:600;
  }
  .mockup-banner b{color:var(--gold);}

  /* ---------- TOP BAR ---------- */
  .topbar{
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 0;
    gap:16px;
    flex-wrap:wrap;
  }
  .flags-row{display:flex; align-items:center; gap:8px;}
  .flags-row img{
    width:26px; height:18px; object-fit:cover;
    border-radius:1px;
    box-shadow:0 0 0 1px var(--line-strong);
    transition:transform .15s ease;
  }
  .flags-row button{
    background:none; border:none; padding:2px; display:flex;
  }
  .flags-row button:hover img{transform:translateY(-2px);}
  .flags-row .plus{
    font-size:12px; color:var(--ink-soft); font-weight:600; margin-inline-start:2px;
  }
  .lang-switch{display:flex; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:3px;}
  .lang-switch button{
    border:none; background:none; padding:5px 13px; border-radius:20px;
    font-size:12.5px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em;
  }
  .lang-switch button.active{background:var(--red); color:#fff;}

  /* ---------- MAIN NAV ---------- */
  .mainnav{
    background:var(--surface);
    border-bottom:2px solid var(--ink);
    position:sticky; top:0; z-index:50;
  }
  .mainnav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0; gap:20px; flex-wrap:wrap;
  }
  .logo{display:flex; align-items:center; gap:11px; cursor:pointer; background:none; border:none; padding:0;}
  .logo-mark{
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .logo-mark svg{width:100%; height:100%; display:block;}
  .logo-text{display:flex; flex-direction:column; line-height:1.1;}
  .logo-text b{font-family:var(--serif); font-size:19px; font-weight:700;}
  .logo-text small{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .navlinks{display:flex; gap:2px; flex-wrap:wrap;}
  .navlinks button{
    background:none; border:none; padding:9px 13px;
    font-size:14px; font-weight:600; color:var(--ink-soft);
    border-bottom:3px solid transparent;
  }
  .navlinks button:hover{color:var(--ink);}
  .navlinks button.active{color:var(--red); border-bottom-color:var(--red);}

  /* ---------- HERO ---------- */
  .hero{
    padding:60px 0 50px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 88% 15%, rgba(163,22,33,.06), transparent 45%),
      radial-gradient(circle at 8% 90%, rgba(16,85,44,.07), transparent 45%);
  }
  .hero-grid{display:grid; grid-template-columns:1.25fr 1fr; gap:48px; align-items:center;}
  .eyebrow-line{
    display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .eyebrow-line .dash{width:34px; height:2px; background:var(--red);}
  .eyebrow-line span{font-size:13px; font-weight:700; color:var(--red-deep);}
  .hero h1{font-size:44px; line-height:1.12; margin-bottom:18px; letter-spacing:-.01em;}
  .hero p.lead{font-size:17.5px; color:var(--ink-soft); max-width:52ch; margin-bottom:28px;}
  .hero-ctas{display:flex; gap:12px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 22px; font-size:14.5px; font-weight:700;
    border-radius:3px; border:1.5px solid transparent;
    text-decoration:none;
  }
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-deep);}
  .btn-outline{background:none; border-color:var(--ink); color:var(--ink);}
  .btn-outline:hover{background:var(--ink); color:#fff;}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn-gold:hover{background:#a3771f;}
  .btn-sm{padding:8px 14px; font-size:13px;}

  .hero-map{
    background:var(--surface); border:1px solid var(--line); border-radius:3px;
    padding:22px; box-shadow:0 2px 0 var(--line);
  }
  .hero-map-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:14px;}
  .country-strip{display:flex; flex-direction:column; gap:0;}
  .country-strip .row{
    display:flex; align-items:center; gap:10px; padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:14px; font-weight:600;
  }
  .country-strip .row:last-child{border-bottom:none;}
  .country-strip img{width:24px; height:17px; box-shadow:0 0 0 1px var(--line-strong); object-fit:cover;}
  .country-strip .row small{margin-inline-start:auto; color:var(--ink-soft); font-weight:600; font-size:12px;}

  .stats-bar{display:flex; gap:0; margin-top:36px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .stats-bar .stat{flex:1; padding:20px 10px; text-align:center; border-inline-end:1px solid var(--line);}
  .stats-bar .stat:last-child{border-inline-end:none;}
  .stats-bar .stat b{display:block; font-family:var(--serif); font-size:30px; color:var(--red-deep);}
  .stats-bar .stat span{font-size:12.5px; color:var(--ink-soft); font-weight:600;}

  /* ---------- SECTION GENERIC ---------- */
  section.page-section{padding:56px 0;}
  .section-head{margin-bottom:34px; max-width:70ch;}
  .section-head .kicker{font-size:12.5px; font-weight:700; color:var(--red-deep); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; display:block;}
  .section-head h2{font-size:30px; margin-bottom:10px;}
  .section-head p{color:var(--ink-soft); font-size:15.5px;}

  /* ---------- CARDS: MEMBER STATES ---------- */
  .grid-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  @media(max-width:900px){.grid-cards{grid-template-columns:repeat(2,1fr);} .hero-grid{grid-template-columns:1fr;}}
  @media(max-width:620px){.grid-cards{grid-template-columns:1fr;}}
  .country-card{
    background:var(--surface); border:1px solid var(--line); text-align:start;
    padding:0; overflow:hidden; display:flex; flex-direction:column;
  }
  .country-card .flag-band{height:64px; position:relative; overflow:hidden;}
  .country-card .flag-band img{width:100%; height:100%; object-fit:cover;}
  .country-card .body{padding:16px 18px 18px;}
  .country-card .body h3{font-size:18px; margin-bottom:3px;}
  .country-card .body .nra{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:12px; display:block;}
  .country-card .body .cta{font-size:13px; font-weight:700; color:var(--red-deep); display:flex; align-items:center; gap:5px;}
  .country-card{border:none; background:var(--surface); box-shadow:0 0 0 1px var(--line);}
  .country-card:hover{box-shadow:0 0 0 1px var(--red);}
  .country-card:hover .cta{color:var(--red);}

  /* ---------- TWG CARDS ---------- */
  .twg-card{
    background:var(--surface); border-inline-start:5px solid var(--wave1);
    box-shadow:0 0 0 1px var(--line); padding:20px 22px; text-align:start;
    display:flex; flex-direction:column; gap:8px;
  }
  .twg-card[data-wave="2"]{border-inline-start-color:var(--wave2);}
  .twg-card[data-wave="3"]{border-inline-start-color:var(--wave3);}
  .twg-card .wave-tag{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);}
  .twg-card h3{font-size:18px;}
  .twg-card p{font-size:14px; color:var(--ink-soft);}
  .twg-card .leads{font-size:12.5px; font-weight:700; color:var(--ink); margin-top:4px;}
  .twg-card:hover{box-shadow:0 0 0 1px var(--ink);}

  /* ---------- DETAIL PAGES ---------- */
  .back-link{background:none; border:none; font-size:13.5px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-bottom:22px; padding:0;}
  .back-link:hover{color:var(--red);}
  .detail-hero{display:flex; gap:20px; align-items:center; margin-bottom:30px; flex-wrap:wrap;}
  .detail-hero img.flag-big{width:88px; height:60px; object-fit:cover; box-shadow:0 0 0 1px var(--line-strong);}
  .detail-hero h2{font-size:32px;}
  .detail-hero .sub{color:var(--ink-soft); font-weight:600; font-size:14.5px;}
  .kv-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:26px 0;}
  @media(max-width:700px){.kv-grid{grid-template-columns:1fr;}}
  .kv{background:var(--surface); border:1px solid var(--line); padding:16px 18px;}
  .kv .label{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px; display:block;}
  .kv .value{font-size:15px; font-weight:600;}
  .kv .value a{color:var(--red-deep); text-decoration:underline;}

  /* ---------- LIBRARY ---------- */
  .lib-layout{display:grid; grid-template-columns:230px 1fr; gap:32px;}
  @media(max-width:800px){.lib-layout{grid-template-columns:1fr;}}
  .lib-filters{display:flex; flex-direction:column; gap:4px;}
  .lib-filters button{
    text-align:start; background:none; border:none; padding:10px 12px;
    font-size:14px; font-weight:600; color:var(--ink-soft); border-inline-start:3px solid transparent;
  }
  .lib-filters button.active{color:var(--red-deep); border-inline-start-color:var(--red); background:rgba(163,22,33,.05);}
  .doc-row{
    display:flex; align-items:center; gap:14px; padding:15px 0; border-bottom:1px solid var(--line);
  }
  .doc-icon{
    width:38px; height:38px; flex-shrink:0; background:var(--bg); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--red-deep);
  }
  .doc-row .meta{flex:1;}
  .doc-row .meta .title{font-weight:700; font-size:14.5px;}
  .doc-row .meta .sub{font-size:12.5px; color:var(--ink-soft);}
  .phase-pill{
    font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;
    white-space:nowrap;
  }
  .phase-pill.p1{background:rgba(16,85,44,.12); color:var(--green-deep);}
  .phase-pill.p2{background:rgba(192,138,40,.15); color:#8a6414;}
  .phase-pill.p3{background:rgba(163,22,33,.1); color:var(--red-deep);}
  .notice-box{
    background:#FBF4E4; border:1px solid var(--gold); padding:16px 18px; font-size:13.5px; color:#5c4413; margin-bottom:26px;
    display:flex; gap:10px;
  }

  /* ---------- ADMIN / SECRETARIAT ---------- */
  .admin-badge-btn{
    background:var(--ink); color:#F2E9D8; border:none; padding:8px 15px;
    font-size:12.5px; font-weight:700; border-radius:20px; display:flex; align-items:center; gap:6px;
  }
  .admin-badge-btn:hover{background:var(--red-deep);}
  .admin-layout{display:grid; grid-template-columns:220px 1fr; gap:32px;}
  @media(max-width:800px){.admin-layout{grid-template-columns:1fr;}}
  .admin-tabs{display:flex; flex-direction:column; gap:4px;}
  .admin-tabs button{
    text-align:start; background:none; border:none; padding:11px 13px;
    font-size:14px; font-weight:600; color:var(--ink-soft); border-inline-start:3px solid transparent;
  }
  .admin-tabs button.active{color:var(--red-deep); border-inline-start-color:var(--red); background:rgba(163,22,33,.05);}
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:30px;}
  @media(max-width:800px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-card{background:var(--surface); border:1px solid var(--line); padding:18px;}
  .kpi-card b{display:block; font-family:var(--serif); font-size:28px; color:var(--red-deep);}
  .kpi-card span{font-size:12px; color:var(--ink-soft); font-weight:600;}
  .activity-list{display:flex; flex-direction:column;}
  .activity-item{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .activity-dot{width:7px; height:7px; border-radius:50%; background:var(--gold); margin-top:6px; flex-shrink:0;}
  .admin-table{width:100%; border-collapse:collapse; font-size:14px;}
  .admin-table th{
    text-align:start; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
    padding:9px 10px; border-bottom:2px solid var(--ink);
  }
  .admin-table td{padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .admin-table tr.clickable{cursor:pointer;}
  .admin-table tr.clickable:hover{background:rgba(163,22,33,.04);}
  .tag-pill{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px;
    background:rgba(16,85,44,.1); color:var(--green-deep); margin-inline-end:4px; margin-bottom:3px;
  }
  .status-chip{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap;}
  .status-draft_twg{background:rgba(138,128,113,.15); color:#665e50;}
  .status-received_secretariat{background:rgba(192,138,40,.15); color:#8a6414;}
  .status-pending_steering{background:rgba(163,22,33,.1); color:var(--red-deep);}
  .status-distributed_internal{background:rgba(16,85,44,.1); color:var(--green-deep);}
  .status-published_public{background:rgba(16,85,44,.18); color:var(--green-deep);}
  .status-revision_requested{background:rgba(192,138,40,.18); color:#8a6414;}
  .status-archived{background:rgba(138,128,113,.2); color:#5b5348;}
  .status-new{background:rgba(163,22,33,.12); color:var(--red-deep);}
  .status-notified{background:rgba(16,85,44,.1); color:var(--green-deep);}
  .status-active{background:rgba(16,85,44,.1); color:var(--green-deep);}
  .status-expired{background:rgba(138,128,113,.15); color:#665e50;}
  .admin-panel{background:var(--surface); border:1px solid var(--line); padding:22px; margin-top:18px;}
  .admin-panel h3{font-size:16px; margin-bottom:12px;}
  .recipient-check{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13.5px;}
  .admin-form-card{background:var(--surface); border:1px solid var(--line); padding:22px; margin-top:16px;}
  .note-line{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-top:14px; display:flex; gap:8px; align-items:flex-start;}

  /* ---------- RIMS PORTAL ---------- */
  .portal-grid{display:grid; grid-template-columns:1fr 1fr; gap:32px;}
  @media(max-width:850px){.portal-grid{grid-template-columns:1fr;}}
  .login-card{background:var(--surface); border:1px solid var(--line); padding:28px;}
  .login-card h3{font-size:19px; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; color:var(--ink-soft);}
  .field input{width:100%; padding:10px 12px; border:1px solid var(--line-strong); font-size:14px; border-radius:2px; font-family:inherit; background:var(--bg);}
  .field-check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-bottom:18px;}
  .rims-list{display:flex; flex-direction:column; gap:10px;}
  .rims-btn{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    padding:13px 16px; text-align:start; width:100%;
  }
  .rims-btn img{width:26px; height:18px; object-fit:cover; box-shadow:0 0 0 1px var(--line-strong);}
  .rims-btn .name{font-weight:700; font-size:14px; flex:1;}
  .rims-btn .status{font-size:11px; font-weight:700; color:var(--green-deep); background:rgba(16,85,44,.1); padding:3px 9px; border-radius:20px;}
  .rims-btn:hover{border-color:var(--red);}
  .rims-btn.rec{border-inline-start:4px solid var(--red);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(32,26,21,.55); display:none;
    align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--surface); max-width:460px; width:100%; padding:28px; border-top:5px solid var(--red);
  }
  .modal-box h4{font-size:18px; margin-bottom:12px;}
  .modal-box p{font-size:14px; color:var(--ink-soft); margin-bottom:20px;}
  .modal-box button{background:var(--ink); color:#fff; border:none; padding:10px 18px; font-weight:700; font-size:13.5px;}

  /* ---------- NEWS ---------- */
  .news-list{display:flex; flex-direction:column;}
  .news-item{display:flex; gap:22px; padding:22px 0; border-bottom:1px solid var(--line);}
  .news-date{width:78px; flex-shrink:0; font-family:var(--serif); font-weight:700; color:var(--red-deep); font-size:14px; padding-top:2px;}
  .news-item h3{font-size:17px; margin-bottom:6px;}
  .news-item p{font-size:14px; color:var(--ink-soft);}

  /* ---------- CONTACT ---------- */
  .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:40px;}
  @media(max-width:850px){.contact-grid{grid-template-columns:1fr;}}
  textarea{width:100%; padding:10px 12px; border:1px solid var(--line-strong); font-family:inherit; font-size:14px; border-radius:2px; background:var(--bg); resize:vertical;}
  .nra-contact-list{display:flex; flex-direction:column; gap:14px;}
  .nra-contact{display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); padding:14px 16px;}
  .nra-contact img{width:32px; height:22px; object-fit:cover; box-shadow:0 0 0 1px var(--line-strong); margin-top:2px;}
  .nra-contact .name{font-weight:700; font-size:14.5px;}
  .nra-contact .line{font-size:12.5px; color:var(--ink-soft);}
  .nra-contact a{color:var(--red-deep); text-decoration:underline;}

  /* ---------- AI CHAT WIDGET (public) ---------- */
  .chat-fab{
    position:fixed; bottom:24px; inset-inline-end:24px; z-index:150;
    width:58px; height:58px; border-radius:50%; border:none;
    background:var(--red); color:#fff; box-shadow:0 4px 16px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .chat-fab:hover{background:var(--red-deep);}
  .chat-panel{
    position:fixed; bottom:92px; inset-inline-end:24px; z-index:150;
    width:360px; max-width:calc(100vw - 32px); height:480px; max-height:70vh;
    background:var(--surface); border:1px solid var(--line); box-shadow:0 8px 30px rgba(0,0,0,.25);
    display:none; flex-direction:column; overflow:hidden; border-radius:4px;
  }
  .chat-panel.open{display:flex;}
  .chat-head{background:var(--ink); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between;}
  .chat-head b{font-family:var(--serif); font-size:15px;}
  .chat-head small{display:block; font-size:11px; color:#C9C0AE; font-weight:600;}
  .chat-head button{background:none; border:none; color:#fff; font-size:18px; cursor:pointer;}
  .chat-body{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--bg);}
  .chat-msg{max-width:82%; padding:9px 12px; font-size:13.5px; line-height:1.5; border-radius:10px;}

  .chat-disclaimer{font-size:10px; color:var(--ink-soft); text-align:center; padding:5px 10px 8px; background:var(--surface);}

    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;

  .ai-panel p{font-size:13.5px; line-height:1.6; margin-bottom:6px;}

  .flow-branches{display:flex; flex-direction:column; gap:6px; flex:1; min-width:150px;}
  .flow-branches .flow-step{border-color:var(--line);}

/* ---- Inline SVG flags (no external network dependency) ---- */
function starPath(cx, cy, outerR, innerR){
  const pts=[];
  for(let i=0;i<10;i++){
    const r = i%2===0?outerR:innerR;
    const angle = (Math.PI/5)*i - Math.PI/2;
    pts.push((cx+r*Math.cos(angle)).toFixed(3)+','+(cy+r*Math.sin(angle)).toFixed(3));
  }
  return pts.join(' ');
}
function crescentGroup(cx, cy, r, notchFill, emblemFill, starR){
  const notchOffset = r*0.30;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${emblemFill}"/>`
       + `<circle cx="${(cx+notchOffset).toFixed(3)}" cy="${cy}" r="${(r*0.82).toFixed(3)}" fill="${notchFill}"/>`
       + `<polygon points="${starPath(cx+r*0.98, cy, starR, starR*0.42)}" fill="${emblemFill}"/>`;
}

function flagInner(code){
  switch(code){
    case 'dz':
      return `<rect width="1.5" height="2" fill="#006233"/><rect x="1.5" width="1.5" height="2" fill="#ffffff"/>${crescentGroup(1.6,1,0.4,'#ffffff','#D21034',0.15)}`;
    case 'eg':
      // Official flag image supplied by the user — embedded as-is, not redrawn.
      return `<image href="${EGYPT_FLAG_IMG}" x="0" y="0" width="3" height="2" preserveAspectRatio="none"/>`;
    case 'ly':
      return `<rect width="3" height="0.5" fill="#239E46"/><rect y="0.5" width="3" height="1" fill="#000000"/><rect y="1.5" width="3" height="0.5" fill="#E70013"/>${crescentGroup(1.55,1,0.32,'#000000','#ffffff',0.13)}`;
    case 'mr':
      return `<rect width="3" height="0.18" fill="#D01C1F"/><rect y="0.18" width="3" height="1.64" fill="#00A65E"/><rect y="1.82" width="3" height="0.18" fill="#D01C1F"/>${crescentGroup(1.5,1,0.38,'#00A65E','#FFC400',0.15)}`;
    case 'ma':
      return `<rect width="3" height="2" fill="#C1272D"/><polygon points="${starPath(1.5,1,0.46,0.18)}" fill="#006233"/><polygon points="${starPath(1.5,1,0.30,0.11)}" fill="#C1272D"/>`;
    case 'tn':
      return `<rect width="3" height="2" fill="#E70013"/><circle cx="1.5" cy="1" r="0.55" fill="#ffffff"/>${crescentGroup(1.5,1,0.34,'#ffffff','#E70013',0.14)}`;
    default:
      return `<rect width="3" height="2" fill="#ccc"/>`;
  }
}
function flagIcon(code, w, h, extra){
  const wAttr = w || '100%', hAttr = h || '100%';
  return `<svg viewBox="0 0 3 2" width="${wAttr}" height="${hAttr}" preserveAspectRatio="xMidYMid slice" `
       + `style="display:block; flex-shrink:0; box-shadow:0 0 0 1px var(--line-strong);${extra||''}" `
       + `xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">${flagInner(code)}</svg>`;
}
function t(){ return T[state.lang]; }
function findCountry(id){ return COUNTRIES.find(c=>c.id===id); }
function orgRoleLabel(role, customText){
  if(!role) return '—';
  if(role==='other') return customText && customText.trim() ? customText : ORG_ROLE_LABELS.other[state.lang];
  return ORG_ROLE_LABELS[role] ? ORG_ROLE_LABELS[role][state.lang] : role;
}
function findTwg(id){ return TWGS.find(w=>w.id===id); }

/* ===================== ROUTER ===================== */
function navigate(route, param){
  state.route = route; state.param = param || null;
  window.scrollTo({top:0, behavior:'smooth'});
  render();
}
window.navigate = navigate;

function setLang(l){ state.lang = l; state.chatMessages=[]; state.internalChatMessages=[]; if(state.chatOpen) state.chatMessages.push({role:'bot', text: T[l].chat.greeting}); render(); }
window.setLang = setLang;

function openModal(title, text){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
window.closeModal = closeModal;
window.openModal = openModal;

function setLibFilter(f){ state.libFilter = f; render(); }
window.setLibFilter = setLibFilter;

function fakeSubmit(ev, kind){
  ev.preventDefault();
  const msgs = { fr:"Message envoyé (aperçu de maquette — aucune donnée n'est transmise).", en:'Message sent (mockup preview — no data is actually transmitted).', ar:'تم إرسال الرسالة (معاينة نموذجية — لا يتم إرسال أي بيانات فعلياً).' };
  const titles = { fr:'Merci', en:'Thank you', ar:'شكراً لك' };
  openModal(titles[state.lang], msgs[state.lang]);
}
window.fakeSubmit = fakeSubmit;

/* ===================== RENDER: CHROME ===================== */
function renderChrome(){
  const L = t();
  document.body.setAttribute('data-lang', state.lang);
  document.documentElement.setAttribute('lang', state.lang);
  document.documentElement.setAttribute('dir', L.dir);

  document.getElementById('bannerText').innerHTML = L.banner;
  document.getElementById('logoSub').textContent = L.logoSub;
  document.getElementById('adminBadgeLabel').textContent = L.nav.admin;

  // flags row
  const flagsRow = document.getElementById('flagsRow');
  flagsRow.innerHTML = COUNTRIES.map(c=>`<button title="${c.name[state.lang]}" onclick="navigate('member','${c.id}')">${flagIcon(c.flag,'26','18')}</button>`).join('') + `<span class="plus">${COUNTRIES.length} ${L.nav.members}</span>`;

  // lang switch
  document.getElementById('langSwitch').innerHTML = ['fr','en','ar'].map(l=>{
    const label = l==='fr'?'FR':l==='en'?'EN':'AR · ع';
    return `<button class="${state.lang===l?'active':''}" onclick="setLang('${l}')">${label}</button>`;
  }).join('');

  // nav links
  const navMap = [['home','home'],['governance','governance'],['members','members'],['twgs','twgs'],['library','library'],['portal','portal'],['news','news'],['contact','contact'],['complaints','complaints']];
  document.getElementById('navLinks').innerHTML = navMap.map(([route,key])=>{
    const active = state.route===route || (route==='members' && state.route==='member') || (route==='twgs' && state.route==='twg');
    return `<button class="${active?'active':''}" onclick="navigate('${route}')">${L.nav[key]}</button>`;
  }).join('');

  // footer
  document.getElementById('footAboutTitle').textContent = L.footer.aboutT;
  document.getElementById('footAboutText').textContent = L.footer.aboutP;
  document.getElementById('footFlags').innerHTML = COUNTRIES.map(c=>`<span title="${c.name[state.lang]}">${flagIcon(c.flag,'24','16')}</span>`).join('');
  document.getElementById('footLinksTitle').textContent = L.footer.linksT;
  document.getElementById('footLinks').innerHTML = navMap.map(([route,key])=>`<li><button onclick="navigate('${route}')">${L.nav[key]}</button></li>`).join('');
  document.getElementById('footContactTitle').textContent = L.footer.contactT;
  document.getElementById('footContactText').innerHTML = L.footer.contactP.replace(/\n/g,'<br>');
  document.getElementById('footPartners').textContent = L.footer.partners;
  document.getElementById('modalClose').textContent = L.portal.modalClose;
}

/* ===================== RENDER: PAGES ===================== */
function pageHome(){
  const L = t();
  const twgWave1 = TWGS.filter(w=>w.wave===1);
  return `
  <section class="hero">

        <div class="hero-ctas">
          <button class="btn btn-primary" onclick="navigate('members')">${L.hero.cta1}</button>
          <button class="btn btn-outline" onclick="navigate('portal')">${L.hero.cta2}</button>
        </div>
      </div>
      <div class="hero-map">
        <div class="hero-map-title">${L.hero.mapTitle}</div>
        <div class="country-strip">
          ${COUNTRIES.map(c=>`<button class="row" style="width:100%;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;color:inherit;font:inherit;" onclick="navigate('member','${c.id}')">${flagIcon(c.flag,'24','17')}<span>${c.name[state.lang]}</span><small>${c.id.toUpperCase()}</small></button>`).join('')}
        </div>
      </div>
    </div>

function personaSubtitle(u){
  const country = findCountry(u.countryId);

    parts.push(roleLabel + ' — ' + w.name[state.lang]);
  });
  return parts.join(' · ');

function submitAddUser(ev){
  ev.preventDefault();
  const f = ev.target;
  const name = f.elements['name'].value.trim();
  const email = f.elements['email'].value.trim();
  const level = f.elements['level'].value;
  const functions = Array.from(f.querySelectorAll('input[type=checkbox]:checked')).map(cb=>cb.value);
  const regionalRole = f.elements['regionalRole'].value || null;
  const regionalRoleOther = f.elements['regionalRoleOther'] ? f.elements['regionalRoleOther'].value.trim() : '';
  const twgRoles = TWGS.map(w=>{
    const val = f.elements['twgrole_'+w.id] ? f.elements['twgrole_'+w.id].value : '';
    return val ? {twgId:w.id, role:val} : null;
  }).filter(Boolean);
  if(!name || !email) return;
  USERS.push({id:'u'+Date.now(), countryId:state.adminCountry, name, email, level, functions, regionalRole, regionalRoleOther, twgRoles});
  state.showAddUser = false;
  const c = findCountry(state.adminCountry);
  logAction(c.name.fr, {fr:'Ajout d\'un utilisateur interne', en:'Added an internal user', ar:'إضافة مستخدم داخلي'}, name);
  render();
}
window.submitAddUser = submitAddUser;

function setDocStatus(id, status){
  const doc = WORKFLOW.find(d=>d.id===id);
  if(!doc) return;
  doc.status = status;
  const L = t().admin.workflow;
  const msg = status==='distributed_internal' ? L.confirmInternal : status==='pending_steering' ? L.confirmSteering : L.confirmPublic;
  const actionLabel = status==='distributed_internal' ? {fr:'Diffusé en interne', en:'Distributed internally', ar:'وُزِّعت داخلياً'}
    : status==='pending_steering' ? {fr:'Soumis au Comité de Pilotage', en:'Submitted to the Steering Committee', ar:'عُرضت على اللجنة التوجيهية'}
    : {fr:'Publié au public', en:'Published publicly', ar:'نُشرت للعموم'};
  doc.history = doc.history || [];
  doc.history.push({date:new Date().toISOString().slice(0,10), action:actionLabel, actor:'Secrétariat'});
  logAction('Secrétariat', {fr:'Changement de statut d\'un document', en:'Changed a document\'s status', ar:'تغيير حالة وثيقة'}, doc.title[state.lang]);
  render();
  openModal(L.confirmT, msg);
}

function submitRequestRevision(ev, id){
  ev.preventDefault();
  const f = ev.target;
  const note = f.elements['note'].value.trim();
  const doc = WORKFLOW.find(d=>d.id===id);
  doc.status = 'revision_requested';
  const parts = doc.version.split('.').map(Number);
  doc.version = parts[0]+'.'+(parts[1]+1);
  doc.history = doc.history || [];
  doc.history.push({date:new Date().toISOString().slice(0,10), action:{fr:'Révision demandée : '+note, en:'Revision requested: '+note, ar:'طُلبت مراجعة: '+note}, actor:'Secrétariat'});
  state.showRequestRevision = false;
  const L = t().admin.workflow;
  logAction('Secrétariat', {fr:'Demande de révision d\'un document', en:'Requested a document revision', ar:'طلب مراجعة وثيقة'}, doc.title[state.lang]);
  render();
  openModal(L.confirmRevisionT, L.confirmRevisionP);
}

function validateDoc(id){
  const doc = WORKFLOW.find(d=>d.id===id);

  doc.history.push({date:new Date().toISOString().slice(0,10), action:{fr:'Validé par le Secrétariat', en:'Validated by the Secretariat', ar:'تمت المصادقة من الأمانة'}, actor:'Secrétariat'});
  const L = t().admin.workflow;
  logAction('Secrétariat', {fr:'Validation d\'un document', en:'Validated a document', ar:'مصادقة على وثيقة'}, doc.title[state.lang]);
  render();

function toggleAddCountry(){ state.showAddCountry = !state.showAddCountry; state.editingCountryInfoId=null; render(); }

function toggleEditCountryInfo(id){ state.editingCountryInfoId = state.editingCountryInfoId===id ? null : id; state.showAddCountry=false; render(); }

function applyTwgRoleSelections(f, countryId){
  TWGS.forEach(w=>{
    const val = f.elements['twgrole_'+w.id] ? f.elements['twgrole_'+w.id].value : '';
    w.members = (w.members||[]).filter(id=>id!==countryId);
    if(val==='lead') w.leads[0] = countryId;
    else if(val==='colead') w.leads[1] = countryId;
    else if(val==='member') w.members.push(countryId);
  });
}

function submitAddCountry(ev){
  ev.preventDefault();
  const f = ev.target;
  const id = f.elements['code'].value.trim().toLowerCase();
  if(!id || findCountry(id)) { alert(state.lang==='ar'?'رمز الدولة مطلوب ويجب أن يكون فريداً':state.lang==='en'?'Country code is required and must be unique':'Le code pays est requis et doit être unique'); return; }
  COUNTRIES.push({
    id, flag:id,
    name:{fr:f.elements['nameFr'].value, en:f.elements['nameEn'].value, ar:f.elements['nameAr'].value},
    nra:{fr:f.elements['nraFr'].value, en:f.elements['nraEn'].value, ar:f.elements['nraAr'].value},
    url:f.elements['url'].value||'—', email:f.elements['email'].value||'—', phone:f.elements['phone'].value||'—',
    address:{fr:'—',en:'—',ar:'—'}, twg:{fr:'—',en:'—',ar:'—'},
    institutionalRole:f.elements['institutionalRole'].value || 'member',
    institutionalRoleOther:f.elements['institutionalRoleOther'] ? f.elements['institutionalRoleOther'].value.trim() : '',
  });
  applyTwgRoleSelections(f, id);
  state.showAddCountry = false;
  const L = t().admin.countries;
  logAction('Secrétariat', {fr:'Ajout d\'un compte pays', en:'Added a country account', ar:'إضافة حساب دولة'}, id.toUpperCase());
  render();
  openModal(L.confirmAddT, L.confirmAddP);
}
window.submitAddCountry = submitAddCountry;

function submitEditCountryInfo(ev, id){
  ev.preventDefault();

  c.name = {fr:f.elements['nameFr'].value, en:f.elements['nameEn'].value, ar:f.elements['nameAr'].value};
  c.nra = {fr:f.elements['nraFr'].value, en:f.elements['nraEn'].value, ar:f.elements['nraAr'].value};
  c.email = f.elements['email'].value;
  c.phone = f.elements['phone'].value;

function deleteCountryAccount(id){
  const c = findCountry(id);
  const leadsAny = TWGS.some(w=>w.leads.includes(id));
  if(leadsAny){
    alert(state.lang==='ar' ? 'لا يمكن حذف هذه الدولة لأنها قائدة أو قائدة مشاركة لمجموعة عمل واحدة أو أكثر.' : state.lang==='en' ? 'This country cannot be deleted because it leads or co-leads one or more TWGs.' : 'Impossible de supprimer ce pays : il est lead ou co-lead d\'un ou plusieurs GTT.');
    return;
  }
  if(!confirm((state.lang==='ar'?'حذف حساب ':state.lang==='en'?'Delete the account for ':'Supprimer le compte de ')+c.name[state.lang]+' ?')) return;
  COUNTRIES = COUNTRIES.filter(x=>x.id!==id);
  USERS = USERS.filter(x=>x.countryId!==id);
  TWGS.forEach(w=>{ w.members = (w.members||[]).filter(cid=>cid!==id); });
  const L = t().admin.countries;
  logAction('Secrétariat', {fr:'Suppression d\'un compte pays', en:'Deleted a country account', ar:'حذف حساب دولة'}, c.name.fr);
  render();
  openModal(L.confirmDeleteT, L.confirmDeleteP);
}
window.deleteCountryAccount = deleteCountryAccount;

function countryTwgRole(w, countryId){
  if(w.leads[0]===countryId) return 'lead';
  if(w.leads[1]===countryId) return 'colead';
  if((w.members||[]).includes(countryId)) return 'member';
  return '';
}

function submitAddNews(ev){
  ev.preventDefault();
  const f = ev.target;
  const item = {
    date:{fr:f.elements['date'].value, en:f.elements['date'].value, ar:f.elements['date'].value},
    title:{fr:f.elements['titleFr'].value, en:f.elements['titleEn'].value, ar:f.elements['titleAr'].value},
    body:{fr:f.elements['bodyFr'].value, en:f.elements['bodyEn'].value, ar:f.elements['bodyAr'].value},
  };
  NEWS.unshift(item);
  state.showAddNews = false;
  const L = t().admin.content.news;
  render();
  openModal(L.confirmSaveT, L.confirmSaveP);
}
window.submitAddNews = submitAddNews;

function submitEditNews(ev, idx){
  ev.preventDefault();
  const f = ev.target;
  const item = NEWS[idx];
  item.date = {fr:f.elements['date'].value, en:f.elements['date'].value, ar:f.elements['date'].value};
  item.title = {fr:f.elements['titleFr'].value, en:f.elements['titleEn'].value, ar:f.elements['titleAr'].value};
  item.body = {fr:f.elements['bodyFr'].value, en:f.elements['bodyEn'].value, ar:f.elements['bodyAr'].value};
  state.editingNewsId = null;
  const L = t().admin.content.news;
  render();
  openModal(L.confirmSaveT, L.confirmSaveP);
}

}

/* ===================== AI: KNOWLEDGE BASE SEARCH (simulated) ===================== */
// NOTE: This searches the platform's own in-memory data (countries, TWGs, documents,
// workflow, alerts, users, experts) with simple keyword matching to simulate a
// generative assistant grounded in the documentation. In production this would call
// a real generative model (e.g. Claude via the Anthropic API) with retrieval over the
// REC-RIMS document repository.

function norm(s){ return (s||'').toLowerCase(); }

function findCountryByQuery(q){
  return COUNTRIES.find(c =>
    q.includes(norm(c.name.fr)) || q.includes(norm(c.name.en)) || q.includes(norm(c.name.ar)) ||
    new RegExp('(^|[^a-z])'+c.id+'([^a-z]|$)').test(q)
  );
}

const TWG_KEYWORDS = {
  'ma-twg': ['homologation','marketing authorisation','amm','تسجيل','ترخيص'],
  'gmp-twg': ['bpf','gmp','inspection','تفتيش'],
  'ims-twg': ['information','système d\'information','ims','معلومات'],
  'qms-twg': ['qualité','quality','qms','جودة'],
  'pv-twg': ['pharmacovigilance','يقظة'],
};

function searchPublicKB(query, lang){
  const q = norm(query);

  if(['états membres','etats membres','member states','member state','دول أعضاء','الدول الأعضاء','quels sont les','which countries','combien de pays','combien d\'états'].some(k=>q.includes(k)) && !findCountryByQuery(q)){
    const list = COUNTRIES.map(c=>'• '+c.name[lang]+' — '+c.nra[lang]).join('\n');
    return (lang==='ar' ? 'الدول الأعضاء في NA-MRH:\n' : lang==='en' ? 'NA-MRH Member States:\n' : 'Les États membres de NA-MRH :\n') + list;
  }

  const country = findCountryByQuery(q);
  if(country){
    const L = t().members;
    return `${country.name[lang]} — ${country.nra[lang]}.\n${L.urlT}: ${country.url}\n${L.emailT}: ${country.email} · ${L.phoneT}: ${country.phone}`;
  }

  for(const twgId in TWG_KEYWORDS){
    if(TWG_KEYWORDS[twgId].some(k=>q.includes(k))){
      const w = findTwg(twgId);
      return `${w.name[lang]} — ${w.desc[lang]}\n${t().twgsPage.leadT}: ${findCountry(w.leads[0]).name[lang]} · ${t().twgsPage.coleadT}: ${findCountry(w.leads[1]).name[lang]}`;
    }
  }

  if(['portail','rims','connexion','login','بوابة','portal'].some(k=>q.includes(k))){
    return t().portal.p + ' ' + t().portal.rimsP;
  }

  if(['bibliothèque','document','guide','ligne directrice','library','مكتبة','وثيقة','template','modèle'].some(k=>q.includes(k))){
    const pub = DOCS.filter(d=>d.visibility==='public').map(d=>'• '+d.title[lang]).join('\n');
    return (lang==='ar' ? 'الوثائق العامة المتاحة:\n' : lang==='en' ? 'Public documents available:\n' : 'Documents publics disponibles :\n') + pub;
  }

  if(['contact','secrétariat','secretariat','coordinatrice','coordinator','اتصال','الأمانة'].some(k=>q.includes(k))){
    return t().contact.secP + '\ndpm@rns.tn · +216 71 78 31 95';
  }

  if(['mission','objectif','à propos','about','حوكمة','رسالة','harmonisation'].some(k=>q.includes(k))){
    return t().hero.lead;
  }

  if(['réclamation','complaint','شكوى'].some(k=>q.includes(k))){
    return t().complaintsPage.p;
  }

  return null;
}

function searchInternalKB(query, lang){
  const q = norm(query);

  if(['attente','pending','بانتظار','décision','decision','قرار'].some(k=>q.includes(k))){
    const pending = WORKFLOW.filter(d=>d.status==='received_secretariat' || d.status==='pending_steering');
    if(pending.length===0) return lang==='ar' ? 'لا توجد وثائق بانتظار القرار حالياً.' : lang==='en' ? 'No documents are currently awaiting a decision.' : 'Aucun document n\'est actuellement en attente de décision.';
    return (lang==='ar'?'وثائق بانتظار القرار:\n':lang==='en'?'Documents awaiting a decision:\n':'Documents en attente de décision :\n') + pending.map(d=>'• '+d.title[lang]+' — '+t().admin.workflow.status[d.status]).join('\n');
  }

  if(['alerte','veille','alert','watch','تنبيه','رصد'].some(k=>q.includes(k))){
    const news = ALERTS.filter(a=>a.status==='new');
    if(news.length===0) return lang==='ar' ? 'لا توجد تنبيهات جديدة غير معالجة.' : lang==='en' ? 'There are no new unprocessed alerts.' : 'Aucune alerte non traitée pour le moment.';
    return (lang==='ar'?'تنبيهات غير معالجة:\n':lang==='en'?'Unprocessed alerts:\n':'Alertes non traitées :\n') + news.map(a=>'• ['+t().admin.watch.urgency[a.urgency]+'] '+a.title[lang]+' ('+a.source+')').join('\n');
  }

  const country = findCountryByQuery(q);
  if(country && ['utilisateur','compte','user','account','مستخدم','حساب'].some(k=>q.includes(k))){
    const users = USERS.filter(u=>u.countryId===country.id);
    const admin = users.find(u=>u.level==='admin');
    return `${country.name[lang]} : ${users.length} ${lang==='ar'?'مستخدمين':lang==='en'?'users':'utilisateurs'} — ${lang==='ar'?'المسؤول الإداري':lang==='en'?'administrator':'administrateur'}: ${admin ? admin.name : '—'}`;
  }

  if(['expert'].some(k=>q.includes(k))){
    const matched = FUNCTIONS.filter(f=>q.includes(norm(FUNCTION_LABELS[f].fr)) || q.includes(norm(FUNCTION_LABELS[f].en)) || q.includes(FUNCTION_LABELS[f].ar));
    const domain = matched[0];
    let list;
    if(domain){
      list = EXPERTS.filter(e=>e.domain===domain).map(e=>'• '+e.name+' — '+e.org[lang]);
    } else {
      list = EXPERTS.map(e=>'• '+e.name+' — '+FUNCTION_LABELS[e.domain][lang]);
    }
    if(list.length===0) return lang==='ar' ? 'لم يتم العثور على خبراء في هذا المجال.' : lang==='en' ? 'No experts found in that domain.' : 'Aucun expert trouvé dans ce domaine.';
    return (lang==='ar'?'الخبراء الخارجيون:\n':lang==='en'?'External experts:\n':'Experts externes :\n') + list.join('\n');
  }

  return searchPublicKB(query, lang);
}

function toggleAddMission(){ state.showAddMission = !state.showAddMission; render(); }
window.toggleAddMission = toggleAddMission;
function submitAddMission(ev){
  ev.preventDefault();
  const f = ev.target;
  const countries = Array.from(f.querySelectorAll('input[name=missionCountry]:checked')).map(cb=>cb.value);
  const item = {
    id:'mi'+Date.now(), twgId:f.elements['twgId'].value || null, countries,
    start:f.elements['start'].value, end:f.elements['end'].value, status:'proposed', report:null,
    budget:Number(f.elements['budget'].value)||0, notes:[],
    title:{fr:f.elements['titleFr'].value, en:f.elements['titleEn'].value, ar:f.elements['titleAr'].value},
  };
  MISSIONS.push(item);
  state.showAddMission = false;
  const L = t().admin.missions;
  logAction('Secrétariat', {fr:'Proposition d\'une mission', en:'Proposed a mission', ar:'اقتراح مهمة'}, item.title.fr);
  render();
  openModal(L.confirmAddT, L.confirmAddP);
}
window.submitAddMission = submitAddMission;
function setMissionStatus(id, status){
  const m = MISSIONS.find(x=>x.id===id);
  if(!m) return;
  m.status = status;
  const L = t().admin.missions;
  logAction('Secrétariat', {fr:'Changement de statut d\'une mission', en:'Changed a mission status', ar:'تغيير حالة مهمة'}, m.title[state.lang]);
  render();
  openModal(L.confirmSaveT, L.confirmSaveP);
}
window.setMissionStatus = setMissionStatus;
function toggleMissionDetail(id){ state.expandedMission = state.expandedMission===id ? null : id; render(); }
window.toggleMissionDetail = toggleMissionDetail;
function toggleDiscussDoc(missionId, docId){
  const m = MISSIONS.find(x=>x.id===missionId);
  m.discussDocs = m.discussDocs || [];
  const i = m.discussDocs.indexOf(docId);
  if(i>=0) m.discussDocs.splice(i,1); else m.discussDocs.push(docId);
  const doc = WORKFLOW.find(x=>x.id===docId);
  logAction('Secrétariat', {fr:'Document lié à une mission pour discussion', en:'Linked a document to a mission for discussion', ar:'ربط وثيقة بمهمة للمناقشة'}, doc.title[state.lang]);
  render();
}
window.toggleDiscussDoc = toggleDiscussDoc;
function submitMissionNote(ev, id){
  ev.preventDefault();
  const f = ev.target;
  const text = f.elements['note'].value.trim();
  if(!text) return;
  const m = MISSIONS.find(x=>x.id===id);
  m.notes = m.notes || [];
  m.notes.push({date:new Date().toISOString().slice(0,10), author:'Secrétariat', text:{fr:text, en:text, ar:text}});
  const L = t().admin.missions;
  logAction('Secrétariat', {fr:'Note de suivi ajoutée à une mission', en:'Added a follow-up note to a mission', ar:'إضافة ملاحظة متابعة إلى مهمة'}, m.title[state.lang]);
  render();
  openModal(L.confirmNoteT, L.confirmNoteP);
}
window.submitMissionNote = submitMissionNote;
function submitMissionReport(ev, id){
  ev.preventDefault();
  const f = ev.target;
  const text = f.elements['report'].value.trim();
  if(!text) return;
  const m = MISSIONS.find(x=>x.id===id);
  m.report = {fr:text, en:text, ar:text};
  m.status = 'completed';
  const L = t().admin.missions;
  logAction('Secrétariat', {fr:'Rapport de mission rédigé', en:'Mission report written', ar:'تحرير تقرير المهمة'}, m.title[state.lang]);

  openModal(L.confirmSaveT, L.confirmSaveP);
}

/* ===================== ADMIN: ANNUAL REPORT ===================== */
function generateAnnualReport(){
  const lang = state.lang;
  const lines = TWGS.map(w=>{
    const acts = ACTIVITIES.filter(a=>a.twgId===w.id);
    const done = acts.filter(a=>a.status==='done').length;
    const planned = acts.filter(a=>a.status==='planned').length;
    const cancelled = acts.filter(a=>a.status==='cancelled').length;
    const docs = WORKFLOW.filter(d=>d.twg===w.id).length;
    const budget = acts.reduce((s,a)=>s+(a.budget||0),0);
    const label = lang==='ar' ? `${w.name.ar} : ${done} منجزة، ${planned} مخطط لها، ${cancelled} ملغاة — ${docs} وثيقة — ميزانية ${budget.toLocaleString()} دولار`
      : lang==='en' ? `${w.name.en}: ${done} done, ${planned} planned, ${cancelled} cancelled — ${docs} document(s) — budget $${budget.toLocaleString()}`
      : `${w.name.fr} : ${done} réalisée(s), ${planned} planifiée(s), ${cancelled} annulée(s) — ${docs} document(s) — budget $${budget.toLocaleString()}`;
    return label;
  });
  const totalBudget = ACTIVITIES.reduce((s,a)=>s+(a.budget||0),0);
  const header = lang==='ar' ? `تقرير النشاط السنوي — ${new Date().getFullYear()}\nالميزانية الإجمالية للأنشطة: ${totalBudget.toLocaleString()} دولار\n`
    : lang==='en' ? `Annual Activity Report — ${new Date().getFullYear()}\nTotal activity budget: $${totalBudget.toLocaleString()}\n`
    : `Rapport d\'activité annuel — ${new Date().getFullYear()}\nBudget total des activités : $${totalBudget.toLocaleString()}\n`;
  state.annualReport = header + '\n' + lines.join('\n');
  logAction('Secrétariat', {fr:'Génération du rapport d\'activité annuel', en:'Generated the annual activity report', ar:'توليد تقرير النشاط السنوي'}, new Date().getFullYear()+'');
  render();
}
window.generateAnnualReport = generateAnnualReport;

/* ===================== MAIN RENDER ===================== */
function render(){
  renderChrome();
  const app = document.getElementById('app');
  let html = '';
  switch(state.route){
    case 'home': html = pageHome(); break;
    case 'governance': html = pageGovernance(); break;
    case 'members': html = pageMembers(); break;
    case 'member': html = pageMemberDetail(state.param); break;
    case 'twgs': html = pageTwgs(); break;
    case 'twg': html = pageTwgDetail(state.param); break;
    case 'library': html = pageLibrary(); break;
    case 'portal': html = pagePortal(); break;
    case 'news': html = pageNews(); break;
    case 'contact': html = pageContact(); break;
    case 'complaints': html = pageComplaints(); break;
    case 'admin': html = pageAdmin(); break;
    case 'national': html = pageNational(); break;
    default: html = pageHome();
  }
  app.innerHTML = html;
  renderChatWidget();
}

render();
</script>
